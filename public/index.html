<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CalificaUT · Calculadora de promedio</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main>
    <h1>CalificaUT</h1>
    <p>Calcula el promedio de tus tres parciales.</p>

    <form id="form-calificaciones">
      <label for="p1">Parcial 1</label>
      <input id="p1" type="number" step="0.1">

      <label for="p2">Parcial 2</label>
      <input id="p2" type="number" step="0.1">

      <label for="p3">Parcial 3</label>
      <input id="p3" type="number" step="0.1">

      <div class="botones">
        <button type="submit">Calcular</button>
        <button type="button" id="limpiar">Limpiar</button>
      </div>
    </form>

    <p id="error" role="alert"></p>

    <section id="resultado" aria-live="polite">
      <p>Promedio: <strong data-testid="promedio"></strong></p>
      <p>Estatus: <strong data-testid="estatus"></strong></p>
      <p>Folio: <span data-testid="folio"></span></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
